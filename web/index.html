<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EduPeak | Student Learning App</title>
  <meta name="description" content="EduPeak student app for study, homework submissions, papers, exams, and rankings.">
  
  <!-- PWA & Apple iOS Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPeak">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F6FAFF">
  
  <!-- Apple Touch Icons & Web Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/edupeak_logo.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/edupeak_logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/edupeak_logo.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/edupeak_logo.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="./css/app.css?v=1.1.0">
  <link rel="stylesheet" href="./css/gatekeeper.css?v=1.1.0">
  <link rel="stylesheet" href="./css/camera-scanner.css?v=1.1.0">
  <link rel="stylesheet" href="./css/exam-room.css?v=1.1.0">
  <link rel="stylesheet" href="./css/features.css?v=1.1.0">
</head>
<body>
  <!-- App Mounting Root -->
  <div id="app-root"></div>

  <!-- Show an actionable message if the module graph (including Firebase SDK imports) fails to load. -->
  <script>
    (() => {
      const showStartupError = () => {
        if (window.app) return;
        document.getElementById('app-splash-screen')?.remove();
        const root = document.getElementById('app-root');
        if (!root) return;
        root.innerHTML = `
          <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:#0B1220;color:#F8FAFC;font-family:system-ui,sans-serif;">
            <section style="max-width:360px;text-align:center;">
              <h1 style="font-size:22px;margin:0 0 12px;">EduPeak couldn’t start</h1>
              <p style="color:#CBD5E1;line-height:1.6;margin:0 0 18px;">The app’s JavaScript or Firebase SDK did not load. Check your internet connection and access to <strong>www.gstatic.com</strong>, then retry.</p>
              <button onclick="location.reload()" style="border:0;border-radius:10px;background:#2563EB;color:white;padding:11px 20px;font-weight:700;cursor:pointer;">Retry</button>
            </section>
          </main>`;
      };
      window.addEventListener('error', (event) => {
        if (event.target?.tagName === 'SCRIPT' && event.target.type === 'module') showStartupError();
      }, true);
      setTimeout(() => {
        if (!window.app && !document.querySelector('.gatekeeper-overlay,.auth-screen-container')) showStartupError();
      }, 10000);
    })();
  </script>

  <!-- Firebase SDK is bundled locally so the app does not depend on a browser reaching gstatic. -->
  <script type="module" src="./js/app.bundle.js?v=1.2.2"></script>
</body>
</html>
