<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Ambient Ring Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="32" filter="url(#glow)" />

  <!-- Quantum / Physics Orbital Ellipses -->
  <g transform="translate(256, 256)">
    <!-- Orbit 1 -->
    <ellipse rx="170" ry="62" fill="none" stroke="url(#cyanGrad)" stroke-width="5" transform="rotate(-30)" stroke-dasharray="12 8" opacity="0.8" />
    <!-- Orbit 2 -->
    <ellipse rx="170" ry="62" fill="none" stroke="url(#primaryGrad)" stroke-width="5" transform="rotate(30)" stroke-dasharray="14 6" opacity="0.85" />
    <!-- Orbit 3 -->
    <ellipse rx="170" ry="62" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" transform="rotate(90)" opacity="0.6" />
    
    <!-- Orbiting Quantum Particles -->
    <circle cx="147" cy="-85" r="9" fill="#22D3EE" filter="url(#glow)" />
    <circle cx="-147" cy="85" r="9" fill="#3B82F6" filter="url(#glow)" />
    <circle cx="0" cy="-170" r="8" fill="#F59E0B" filter="url(#glow)" />
  </g>

  <!-- Peak / Shield Core -->
  <g transform="translate(256, 260) scale(1.1)">
    <!-- Mountain Peak Silhouette -->
    <path d="M-85,70 L0,-75 L85,70 L35,70 L0,15 L-35,70 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    <!-- Inner Glacier Highlight -->
    <path d="M-40,70 L0,-5 L40,70 L15,70 L0,42 L-15,70 Z" fill="url(#cyanGrad)" opacity="0.9" />
    <!-- Center Energy Core -->
    <circle cx="0" cy="-75" r="14" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="0" cy="-75" r="8" fill="#22D3EE" />
  </g>

  <!-- EduPeak Brand Typography -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">
    EDU<tspan fill="#38BDF8">PEAK</tspan>
  </text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
    PHYSICS INSTITUTE
  </text>
</svg>
