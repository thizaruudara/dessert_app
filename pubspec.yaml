name: dessert_app
description: Institute Dessert Homework Submission & Review App
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # UI / UX
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  shared_preferences: ^2.3.2
  uuid: ^4.5.0
  timeago: ^3.7.0

  # Real-Time Video Proctoring (Agora RTC)
  agora_rtc_engine: ^6.3.2
  agora_token_generator: ^0.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
